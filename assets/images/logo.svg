<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A059"/>
      <stop offset="50%" stop-color="#DFBD73"/>
      <stop offset="100%" stop-color="#9F7E35"/>
    </linearGradient>
    <linearGradient id="brownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A2E1B"/>
      <stop offset="100%" stop-color="#27140B"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#27140B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Square -->
  <rect x="20" y="20" width="160" height="160" rx="36" fill="url(#brownGrad)" stroke="url(#goldGrad)" stroke-width="4" filter="url(#shadow)"/>

  <!-- Delivery Van / Package Icon in Gold -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Box Base -->
    <path d="M60 70 L100 50 L140 70 L140 120 L100 140 L60 120 Z"/>
    <!-- Box Flaps -->
    <path d="M100 50 L100 140"/>
    <path d="M60 70 L100 90 L140 70"/>
    <!-- Fast Motion Lines -->
    <path d="M45 85 L35 85" stroke-width="6"/>
    <path d="M45 105 L30 105" stroke-width="6"/>
    <path d="M45 125 L38 125" stroke-width="6"/>
  </g>
</svg>
